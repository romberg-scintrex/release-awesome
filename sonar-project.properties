# ─── Project Identification ────────────────────────────────────────────────────
sonar.projectKey=release_awesome-0000
sonar.projectName=release_awesome
sonar.projectVersion=0.1.0
sonar.organization=dimasyudhana

# ─── Source Configuration ──────────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ─── Language & TypeScript ─────────────────────────────────────────────────────
sonar.language=ts
sonar.typescript.tsconfigPaths=tsconfig.json

# ─── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/public/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/supabase/migrations/**

sonar.coverage.exclusions=\
  src/app/**/layout.tsx,\
  src/app/**/page.tsx,\
  src/app/**/not-found.tsx,\
  src/app/**/opengraph-image.tsx,\
  src/app/**/robots.ts,\
  src/app/**/sitemap.ts,\
  src/components/Elements/Icons/**,\
  src/components/Elements/Providers/**,\
  src/lib/types.ts

sonar.cpd.exclusions=\
  src/components/Elements/Icons/**

