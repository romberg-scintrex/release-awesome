# ─── Project Identification ────────────────────────────────────────────────────
sonar.projectKey=release-awesome_0000
sonar.projectName=release_awesome_0000
sonar.projectVersion=0.1.0
sonar.organization=dimasyudhana

# ─── Source Configuration ──────────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ─── Language & TypeScript ─────────────────────────────────────────────────────
sonar.language=ts
sonar.typescript.tsconfigPaths=tsconfig.json

# ─── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/public/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/supabase/migrations/**

sonar.coverage.exclusions=\
  src/app/**/layout.tsx,\
  src/app/**/page.tsx,\
  src/app/**/not-found.tsx,\
  src/app/**/opengraph-image.tsx,\
  src/app/**/robots.ts,\
  src/app/**/sitemap.ts,\
  src/components/Elements/Icons/**,\
  src/components/Elements/Providers/**,\
  src/components/Fragments/MaskReveal/**,\
  src/components/Fragments/HeroMobile/**,\
  src/components/Fragments/HeroOverlay/**,\
  src/components/Elements/CustomCursor/**,\
  src/components/Elements/ScrollSmooth/**,\
  src/components/Elements/PageTransition/**,\
  src/components/Elements/RouteProgress/**,\
  src/components/Elements/ScrollTop/**,\
  src/components/Layouts/**,\
  src/lib/fluid-simulation/**,\
  src/lib/admin/**,\
  src/lib/supabase/**,\
  src/lib/api/**,\
  src/lib/types.ts,\
  src/lib/default.ts,\
  src/middleware.ts

sonar.cpd.exclusions=\
  src/components/Elements/Icons/**

# ─── Test Configuration ────────────────────────────────────────────────────────
# sonar.tests=src
# sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ─── Coverage (lcov from vitest) ───────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

